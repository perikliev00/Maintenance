global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: maintenance
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: maintenance-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:4000]
  - job_name: postgresql
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]
