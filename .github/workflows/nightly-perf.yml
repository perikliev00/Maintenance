name: Nightly catalog performance

permissions:
  contents: read

on:
  schedule:
    # 02:15 UTC nightly
    - cron: "15 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locations-catalog-100k:
    name: Locations catalog 100k (opt-in)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maintenance
          POSTGRES_PASSWORD: maintenance
          POSTGRES_DB: maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance -d maintenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-test-secret-at-least-32-chars-long!!
      LOCATIONS_PERF_100K: "1"
      EXPECTED_TEST_DATABASE: maintenance_p1_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Prepare maintenance_p1_test
        working-directory: .
        env:
          PGPASSWORD: maintenance
          API_DIR: api
        run: bash scripts/ci/prepare-p1-test-db.sh --seed=none

      - name: Run 1k/10k/100k catalog perf suite
        run: node ./tests/runWithP1Isolation.mjs --test-concurrency=1 tests/scenarios/locations.catalog.perf.db.test.ts
        env:
          LOCATIONS_PERF_100K: "1"
