name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm run typecheck:tests

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:tests
      - run: npm test

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maintenance
          POSTGRES_PASSWORD: maintenance
          POSTGRES_DB: maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance -d maintenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://maintenance:maintenance@localhost:5432/maintenance?schema=public
      JWT_SECRET: ci-test-secret-at-least-32-chars-long!!
      ALLOW_DEMO_SEED: "true"
      DEMO_SEED_DATABASE_NAME: maintenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx scripts/assert-sql-invariants.ts
      - run: npm run db:seed
      # Isolated DB for sectors/shifts/my-work (preload rewrites DATABASE_URL by name).
      - name: Prepare maintenance_p1_test
        env:
          PGPASSWORD: maintenance
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          set +e
          OUT=$(psql -h localhost -U maintenance -d postgres -c "CREATE DATABASE maintenance_p1_test OWNER maintenance;" 2>&1)
          EC=$?
          set -e
          if [ $EC -ne 0 ]; then
            echo "$OUT" | grep -qi "already exists" || { echo "$OUT"; exit 1; }
          fi
          DATABASE_URL="postgresql://maintenance:maintenance@localhost:5432/maintenance_p1_test?schema=public&connection_limit=10" \
            npx prisma migrate deploy
          DATABASE_URL="postgresql://maintenance:maintenance@localhost:5432/maintenance_p1_test?schema=public&connection_limit=10" \
            DEMO_SEED_DATABASE_NAME=maintenance_p1_test \
            npm run db:seed
          # Write .env.p1_test without heredoc indent leakage (YAML-safe).
          printf '%s\n' \
            'DATABASE_URL="postgresql://maintenance:maintenance@localhost:5432/maintenance_p1_test?schema=public&connection_limit=10"' \
            'EXPECTED_TEST_DATABASE=maintenance_p1_test' \
            'JWT_SECRET=ci-test-secret-at-least-32-chars-long!!' \
            'WEB_ORIGIN=http://127.0.0.1:5173' \
            > .env.p1_test
      - run: npm run prove:p1-isolation
      - run: npm run test:scenarios
      - run: npm test
      - run: npm run test:cleaning-lifecycle
      - run: npm run test:readiness
      - run: npm run test:tickets-lifecycle
      - run: npm run test:plan
      - run: npm run test:sectors
        env:
          EXPECTED_TEST_DATABASE: maintenance_p1_test
      - run: npm run test:shifts
        env:
          EXPECTED_TEST_DATABASE: maintenance_p1_test
      - run: npm run test:my-work
        env:
          EXPECTED_TEST_DATABASE: maintenance_p1_test
      - run: npm run test:attendance
      - run: npm run test:cards
      - run: npm run db:seed
      - run: npx tsx scripts/smoke-ticket-lifecycle-idempotency.ts
      - run: npx tsx scripts/smoke-cleaning-atomic.ts
      - run: npx tsx scripts/smoke-invitation-atomic.ts
      - run: npx tsx scripts/smoke-invitation-role.ts
      - run: npm run smoke:attendance:isolated
      - run: npx tsx scripts/smoke-maintenance-atomic.ts
      - run: npx tsx scripts/smoke-daily-plan-atomic.ts
      - run: npx tsx scripts/smoke-data-scope.ts

  smoke-audit-upgrade:
    name: Smoke audit upgrade
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maintenance
          POSTGRES_PASSWORD: maintenance
          POSTGRES_DB: maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance -d maintenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://maintenance:maintenance@localhost:5432/maintenance?schema=public
      JWT_SECRET: ci-test-secret-at-least-32-chars-long!!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx scripts/smoke-legacy-audit-upgrade.ts

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maintenance
          POSTGRES_PASSWORD: maintenance
          POSTGRES_DB: maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance -d maintenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://maintenance:maintenance@localhost:5432/maintenance?schema=public
      JWT_SECRET: ci-test-secret-at-least-32-chars-long!!
      WEB_ORIGIN: http://127.0.0.1:5173
      PORT: "4000"
      # Many UI logins + live polls from one runner exceed production IP budgets.
      E2E_DISABLE_RATE_LIMIT: "1"
      ALLOW_DEMO_SEED: "true"
      DEMO_SEED_DATABASE_NAME: maintenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
            e2e/package-lock.json

      - name: Install API
        working-directory: api
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed

      - name: Install Web
        working-directory: web
        run: npm ci

      - name: Install E2E
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: npm test

      - name: Prepare isolated scenario database
        working-directory: api
        env:
          PGPASSWORD: maintenance
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U maintenance -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE maintenance_p1_test OWNER maintenance;"
          printf '%s\n' \
            'DATABASE_URL="postgresql://maintenance:maintenance@localhost:5432/maintenance_p1_test?schema=public&connection_limit=10"' \
            'EXPECTED_TEST_DATABASE=maintenance_p1_test' \
            'JWT_SECRET=ci-test-secret-at-least-32-chars-long!!' \
            'WEB_ORIGIN=http://127.0.0.1:5185' \
            > .env.p1_test
          DATABASE_URL="postgresql://maintenance:maintenance@localhost:5432/maintenance_p1_test?schema=public" npx prisma migrate deploy
          DATABASE_URL="postgresql://maintenance:maintenance@localhost:5432/maintenance_p1_test?schema=public" DEMO_SEED_DATABASE_NAME=maintenance_p1_test node --import ./tests/registerP1TestEnv.mjs --import tsx prisma/seed.ts
          npm run prove:p1-isolation

      - name: Run isolated browser integrations and workflows
        working-directory: e2e
        run: |
          npm run typecheck:scenarios
          npm run test:scenarios

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  containers:
    name: Container verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f compose.prod.yml config --quiet
      - name: Build production images
        run: |
          docker build --target api -t maintenance-api:${GITHUB_SHA} ./api
          docker build --target migrate -t maintenance-migrate:${GITHUB_SHA} ./api
          docker build --target bootstrap -t maintenance-bootstrap:${GITHUB_SHA} ./api
          docker build --target owner-bootstrap -t maintenance-owner:${GITHUB_SHA} ./api
          docker build --target web -t maintenance-web:${GITHUB_SHA} ./web
      - name: Verify runtime Prisma client
        run: docker run --rm --entrypoint node maintenance-api:${GITHUB_SHA} -e "const {PrismaClient}=require('@prisma/client'); if(!PrismaClient) process.exit(1); console.log('Prisma client available')"
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: maintenance-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: maintenance-web:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
