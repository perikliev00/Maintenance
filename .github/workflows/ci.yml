name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck:tests

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck:tests
      - run: npm test

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maintenance
          POSTGRES_PASSWORD: maintenance
          POSTGRES_DB: maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance -d maintenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://maintenance:maintenance@localhost:5432/maintenance?schema=public
      JWT_SECRET: ci-test-secret-at-least-32-chars-long!!
      ALLOW_DEMO_SEED: "true"
      DEMO_SEED_DATABASE_NAME: maintenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx scripts/assert-sql-invariants.ts
      - run: npm run db:seed
      # Isolated DB for sectors/shifts/my-work (preload rewrites DATABASE_URL by name).
      - name: Prepare maintenance_p1_test
        working-directory: .
        env:
          PGPASSWORD: maintenance
          API_DIR: api
        run: bash scripts/ci/prepare-p1-test-db.sh --seed=npm --web-origin=http://127.0.0.1:5173
      - run: npm run prove:p1-isolation
      - run: npm run test:inventory
      # Independent suites: collect exit codes so one failure cannot hide the rest.
      # Final exit is non-zero if any mandatory suite failed (no continue-on-error green).
      - name: Run API test suites (collect failures)
        env:
          EXPECTED_TEST_DATABASE: maintenance_p1_test
        run: |
          set +e
          failed=0
          run_suite() {
            local name="$1"
            shift
            echo "::group::${name}"
            "$@"
            local ec=$?
            echo "::endgroup::"
            if [ "$ec" -ne 0 ]; then
              echo "::error::suite '${name}' failed with exit ${ec}"
              failed=1
            else
              echo "suite '${name}' passed"
            fi
          }
          run_suite scenarios npm run test:scenarios
          run_suite unit-src npm test
          run_suite cleaning npm run test:cleaning-lifecycle
          run_suite readiness npm run test:readiness
          run_suite tickets npm run test:tickets-lifecycle
          run_suite plan npm run test:plan
          run_suite sectors npm run test:sectors
          run_suite shifts npm run test:shifts
          run_suite my-work npm run test:my-work
          run_suite attendance npm run test:attendance
          run_suite cards npm run test:cards
          run_suite people npm run test:people
          run_suite auth npm run test:auth
          exit "$failed"
      - run: npm run db:seed
      - name: Run smoke scripts (collect failures)
        run: |
          set +e
          failed=0
          run_suite() {
            local name="$1"
            shift
            echo "::group::${name}"
            "$@"
            local ec=$?
            echo "::endgroup::"
            if [ "$ec" -ne 0 ]; then
              echo "::error::smoke '${name}' failed with exit ${ec}"
              failed=1
            else
              echo "smoke '${name}' passed"
            fi
          }
          run_suite ticket-lifecycle npx tsx scripts/smoke-ticket-lifecycle-idempotency.ts
          run_suite cleaning-atomic npx tsx scripts/smoke-cleaning-atomic.ts
          run_suite invitation-atomic npx tsx scripts/smoke-invitation-atomic.ts
          run_suite invitation-role npx tsx scripts/smoke-invitation-role.ts
          run_suite attendance-isolated npm run smoke:attendance:isolated
          run_suite maintenance-atomic npx tsx scripts/smoke-maintenance-atomic.ts
          run_suite daily-plan-atomic npx tsx scripts/smoke-daily-plan-atomic.ts
          run_suite data-scope npx tsx scripts/smoke-data-scope.ts
          exit "$failed"

  smoke-audit-upgrade:
    name: Smoke audit upgrade
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maintenance
          POSTGRES_PASSWORD: maintenance
          POSTGRES_DB: maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance -d maintenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://maintenance:maintenance@localhost:5432/maintenance?schema=public
      JWT_SECRET: ci-test-secret-at-least-32-chars-long!!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx scripts/smoke-legacy-audit-upgrade.ts

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maintenance
          POSTGRES_PASSWORD: maintenance
          POSTGRES_DB: maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance -d maintenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://maintenance:maintenance@localhost:5432/maintenance?schema=public
      JWT_SECRET: ci-test-secret-at-least-32-chars-long!!
      WEB_ORIGIN: http://127.0.0.1:5173
      PORT: "4000"
      # Many UI logins + live polls from one runner exceed production IP budgets.
      E2E_DISABLE_RATE_LIMIT: "1"
      ALLOW_DEMO_SEED: "true"
      DEMO_SEED_DATABASE_NAME: maintenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
            e2e/package-lock.json

      - name: Install API
        working-directory: api
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed

      - name: Prepare isolated P1 database for Playwright
        env:
          PGPASSWORD: maintenance
          API_DIR: api
        run: |
          # Main Playwright webServer uses registerP1TestEnv → requires .env.p1_test first.
          bash scripts/ci/prepare-p1-test-db.sh --seed=register --web-origin=http://127.0.0.1:5173 --migrate-plain
          (cd api && npm run prove:p1-isolation)

      - name: Install Web
        working-directory: web
        run: npm ci

      - name: Install E2E
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: npm test

      - name: Point P1 env at scenario web origin
        env:
          PGPASSWORD: maintenance
          API_DIR: api
        run: bash scripts/ci/prepare-p1-test-db.sh --env-only --web-origin=http://127.0.0.1:5185

      - name: Run isolated browser integrations and workflows
        working-directory: e2e
        run: |
          npm run typecheck:scenarios
          npm run test:scenarios

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  containers:
    name: Container verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production Compose
        run: |
          docker compose --env-file .env.production.example -f compose.prod.yml config --quiet
          docker compose --env-file .env.production.example -f compose.prod.yml config --format json | node -e '
            const c=JSON.parse(require("fs").readFileSync(0,"utf8"));
            const t=c.services?.api?.tmpfs;
            const expected=["/tmp:size=32m,noexec,nosuid"];
            if(JSON.stringify(t)!==JSON.stringify(expected)){
              console.error("api.tmpfs must be",expected,"got",t);
              process.exit(1);
            }
            console.log("api.tmpfs ok:", t[0]);
          '
      - name: Build production images
        id: build_images
        run: |
          docker build --target api -t maintenance-api:${GITHUB_SHA} ./api
          docker build --target migrate -t maintenance-migrate:${GITHUB_SHA} ./api
          docker build --target bootstrap -t maintenance-bootstrap:${GITHUB_SHA} ./api
          docker build --target owner-bootstrap -t maintenance-owner:${GITHUB_SHA} ./api
          docker build --target web -f web/Dockerfile -t maintenance-web:${GITHUB_SHA} .
      - name: Verify runtime Prisma client
        run: docker run --rm --entrypoint node maintenance-api:${GITHUB_SHA} -e "const {PrismaClient}=require('@prisma/client'); if(!PrismaClient) process.exit(1); console.log('Prisma client available')"
      - name: Create API container with production Compose tmpfs
        run: API_IMAGE=maintenance-api:${GITHUB_SHA} RELEASE_SHA=${GITHUB_SHA} node scripts/ci/verify-prod-api-compose-create.mjs
      - name: Verify edge routing and monitoring delivery in isolated containers
        run: API_IMAGE=maintenance-api:${GITHUB_SHA} WEB_IMAGE=maintenance-web:${GITHUB_SHA} node scripts/verify-containers.mjs
      - name: Scan API image
        if: ${{ always() && steps.build_images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: maintenance-api:${{ github.sha }}
          format: json
          output: trivy-api.json
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Summarize API vulnerability paths
        if: always()
        run: |
          node - trivy-api.json <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          if (!fs.existsSync(path)) {
            console.log('Trivy API JSON report was not created');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const groups = new Map();
          for (const result of report.Results ?? []) {
            for (const item of result.Vulnerabilities ?? []) {
              if (!['HIGH', 'CRITICAL'].includes(item.Severity)) continue;
              const key = [result.Type, result.Target, item.PkgName, item.InstalledVersion, item.PkgPath, item.Severity].join('|');
              const group = groups.get(key) ?? {
                type: result.Type, target: result.Target, package: item.PkgName,
                installed: item.InstalledVersion, path: item.PkgPath ?? null,
                severity: item.Severity, advisories: []
              };
              group.advisories.push({ id: item.VulnerabilityID, fixed: item.FixedVersion || null });
              groups.set(key, group);
            }
          }
          console.log(JSON.stringify([...groups.values()], null, 2));
          NODE
      - name: Upload API Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-api-json
          path: trivy-api.json
          if-no-files-found: warn
          retention-days: 7
      - name: Scan web image
        if: ${{ always() && steps.build_images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: maintenance-web:${{ github.sha }}
          format: json
          output: trivy-web.json
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Summarize web vulnerability paths
        if: always()
        run: |
          node - trivy-web.json <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          if (!fs.existsSync(path)) {
            console.log('Trivy web JSON report was not created');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const groups = new Map();
          for (const result of report.Results ?? []) {
            for (const item of result.Vulnerabilities ?? []) {
              if (!['HIGH', 'CRITICAL'].includes(item.Severity)) continue;
              const key = [result.Type, result.Target, item.PkgName, item.InstalledVersion, item.PkgPath, item.Severity].join('|');
              const group = groups.get(key) ?? {
                type: result.Type, target: result.Target, package: item.PkgName,
                installed: item.InstalledVersion, path: item.PkgPath ?? null,
                severity: item.Severity, advisories: []
              };
              group.advisories.push({ id: item.VulnerabilityID, fixed: item.FixedVersion || null });
              groups.set(key, group);
            }
          }
          console.log(JSON.stringify([...groups.values()], null, 2));
          NODE
      - name: Upload web Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-web-json
          path: trivy-web.json
          if-no-files-found: warn
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0
    with:
      scan-args: |-
        --lockfile=./api/package-lock.json
        --lockfile=./web/package-lock.json
        --lockfile=./e2e/package-lock.json
      fail-on-vuln: true
      upload-sarif: false

  # P2-T06: OSV on push-to-main (PR-only dependency-review left a main-branch gap).
  osv-main:
    name: OSV scanner (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --lockfile=./api/package-lock.json
        --lockfile=./web/package-lock.json
        --lockfile=./e2e/package-lock.json
      fail-on-vuln: true
      upload-sarif: false
