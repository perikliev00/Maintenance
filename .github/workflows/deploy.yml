name: Deploy immutable release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        type: environment
        required: true
      release_sha:
        description: Full commit SHA of a successful CI and image publish
        type: string
        required: true
  workflow_run:
    workflows: ["Publish immutable images"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: read
  id-token: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate target settings and release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]+:role/.+ ]]
          [[ "$APP_URL" =~ ^https:// ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI" and .head_sha == env.RELEASE_SHA and .event == "push")] | any(.[]; .conclusion == "success")' \
            | grep -qx true

      - name: Authenticate to GHCR for image verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify GHCR images exist for RELEASE_SHA
        env:
          IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          prefix="${IMAGE_PREFIX:-ghcr.io/${owner}}"
          prefix="$(printf '%s' "$prefix" | tr '[:upper:]' '[:lower:]')"
          for name in maintenance-api maintenance-web maintenance-migrate maintenance-bootstrap maintenance-owner; do
            img="${prefix}/${name}:${RELEASE_SHA}"
            echo "Checking $img"
            docker buildx imagetools inspect "$img" >/dev/null
          done

      - name: Resolve AWS region and SSM document names
        id: aws_meta
        run: |
          set -euo pipefail
          echo "aws_region=${AWS_REGION_VAR:-eu-central-1}" >> "$GITHUB_OUTPUT"
          echo "ssm_promote_doc=${SSM_PROMOTE_DOC_VAR:-maintenance-promote}" >> "$GITHUB_OUTPUT"
          echo "ssm_diag_doc=${SSM_DIAG_DOC_VAR:-maintenance-diag}" >> "$GITHUB_OUTPUT"
        env:
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
          SSM_PROMOTE_DOC_VAR: ${{ vars.SSM_PROMOTE_DOC }}
          SSM_DIAG_DOC_VAR: ${{ vars.SSM_DIAG_DOC }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ steps.aws_meta.outputs.aws_region }}
          role-session-name: gha-maintenance-deploy

      - name: Verify SSM agent online
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ steps.aws_meta.outputs.aws_region }}
        run: |
          set -euo pipefail
          info="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"
          echo "SSM PingStatus=$info"
          test "$info" = "Online"

      - name: Promote release via SSM
        id: promote
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          AWS_REGION: ${{ steps.aws_meta.outputs.aws_region }}
          SSM_PROMOTE_DOC: ${{ steps.aws_meta.outputs.ssm_promote_doc }}
        run: |
          set -euo pipefail
          chmod +x scripts/aws/ssm-promote.sh
          ./scripts/aws/ssm-promote.sh

      - name: Post-deploy smoke (ready, metrics lockdown, live, validation)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          chmod +x scripts/post-deploy-smoke.sh
          # Allow TLS / container settle after promote.
          sleep 15
          APP_URL="$APP_URL" ./scripts/post-deploy-smoke.sh

      - name: Deploy failure diagnostics
        if: failure()
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ steps.aws_meta.outputs.aws_region }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSM_DIAG_DOC: ${{ steps.aws_meta.outputs.ssm_diag_doc }}
        run: |
          set +e
          echo "::group::SSM diagnostics"
          chmod +x scripts/aws/ssm-diag.sh
          ./scripts/aws/ssm-diag.sh || true
          echo "::endgroup::"
          echo "::error::Deploy failed. Application-only rollback: scripts/aws/ssm-rollback-app.sh (schema must remain compatible). Database rollback is never automatic."
