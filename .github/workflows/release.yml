name: Publish immutable images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish images by commit SHA
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          owner="$(printf '%s' "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"
          docker buildx build --sbom=true --provenance=mode=max --push --target api -t "$owner/maintenance-api:$RELEASE_SHA" ./api
          docker buildx build --sbom=true --provenance=mode=max --push --target migrate -t "$owner/maintenance-migrate:$RELEASE_SHA" ./api
          docker buildx build --sbom=true --provenance=mode=max --push --target bootstrap -t "$owner/maintenance-bootstrap:$RELEASE_SHA" ./api
          docker buildx build --sbom=true --provenance=mode=max --push --target owner-bootstrap -t "$owner/maintenance-owner:$RELEASE_SHA" ./api
          docker buildx build --sbom=true --provenance=mode=max --push --target web -t "$owner/maintenance-web:$RELEASE_SHA" ./web
